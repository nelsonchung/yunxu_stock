[Unit]
RequiresMountsFor=/media/nelson/work-disk/web-site/yunxu_stock

[Service]
WorkingDirectory=/media/nelson/work-disk/web-site/yunxu_stock
StateDirectory=
StateDirectory=yunxu-shioaji-feed
StateDirectoryMode=0700
Environment=SJ_HOME_PATH=/var/lib/yunxu-shioaji-feed
UnsetEnvironment=SJ_CA_PATH SJ_CA_PASSWD SJ_PERSON_ID
ExecStart=
ExecStart=/opt/yunxu-shioaji-feed/bin/python -B -m stockwatch.quote_gateway
StandardOutput=null
